<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#526078}.head{font-size:18px;font-weight:700}.body{font-size:15px}.box{fill:#f5f8ff;stroke:#5276b8;stroke-width:2}.green{fill:#eefbf4;stroke:#31966a;stroke-width:2}.orange{fill:#fff7ed;stroke:#d97706;stroke-width:2}.gray{fill:#f3f4f6;stroke:#667085;stroke-width:2}.arrow{stroke:#667085;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker></defs>
<rect width="1400" height="980" fill="#fff"/><text x="700" y="48" text-anchor="middle" class="title">Codex + DeepSeek AI 编程助手架构</text><text x="700" y="76" text-anchor="middle" class="sub">自然语言意图识别 · 任务编排 · 工程执行 · 质量闭环</text>
<rect x="440" y="105" width="520" height="65" rx="12" class="gray"/><text x="700" y="132" text-anchor="middle" class="head">用户入口</text><text x="700" y="154" text-anchor="middle" class="body">CLI / IDE / Web / 自然语言需求</text>
<path d="M700 170 V205" class="arrow"/><rect x="340" y="205" width="720" height="92" rx="12" class="box"/><text x="700" y="233" text-anchor="middle" class="head">意图理解与任务规划层</text><text x="700" y="258" text-anchor="middle" class="body">意图分类：Feature / Bugfix / Refactor / Test / Review / DevOps</text><text x="700" y="280" text-anchor="middle" class="body">上下文收集 · 需求澄清 · 风险分级 · 拆解任务 · 验收标准</text>
<path d="M700 297 V330" class="arrow"/><rect x="100" y="330" width="1200" height="94" rx="12" class="green"/><text x="700" y="357" text-anchor="middle" class="head">编排与模型路由层（Orchestrator）</text><text x="700" y="383" text-anchor="middle" class="body">任务状态机 · 上下文/记忆管理 · 工具权限 · 重试与超时 · 人工确认点 · 执行日志</text><text x="700" y="405" text-anchor="middle" class="body">按任务类型、成本、延迟和能力选择 Codex 或 DeepSeek</text>
<path d="M700 424 V454 H360 V478 M700 454 H1040 V478" class="arrow"/><rect x="100" y="478" width="520" height="130" rx="12" class="box"/><text x="360" y="508" text-anchor="middle" class="head">Codex：工程执行 Agent</text><text x="130" y="538" class="body">• 仓库理解与代码导航</text><text x="130" y="561" class="body">• 跨文件修改 / 命令执行</text><text x="130" y="584" class="body">• 测试、修复、补丁与交付</text><rect x="780" y="478" width="520" height="130" rx="12" class="orange"/><text x="1040" y="508" text-anchor="middle" class="head">DeepSeek：推理与辅助 Agent</text><text x="810" y="538" class="body">• 需求分析与方案推演</text><text x="810" y="561" class="body">• 代码解释 / 复杂问题分析</text><text x="810" y="584" class="body">• Review 建议 / 测试用例生成</text>
<path d="M360 608 V638 H700 M1040 608 V638 H700 V662" class="arrow"/><rect x="170" y="662" width="1060" height="102" rx="12" class="green"/><text x="700" y="690" text-anchor="middle" class="head">共享工程能力层</text><text x="700" y="716" text-anchor="middle" class="body">项目规则 / AGENTS.md / Skills / MCP 工具 / Git / 文件系统 / Shell / 构建与测试工具</text><text x="700" y="741" text-anchor="middle" class="body">数据库、Issue、CI/CD、日志等外部系统（按授权接入）</text>
<path d="M700 764 V795" class="arrow"/><rect x="170" y="795" width="1060" height="95" rx="12" class="box"/><text x="700" y="823" text-anchor="middle" class="head">质量门禁与交付闭环</text><text x="700" y="849" text-anchor="middle" class="body">格式/静态检查 → 单元/集成测试 → 独立代码审查 → 缺陷修复与回归</text><text x="700" y="873" text-anchor="middle" class="body">通过：交付摘要、变更文件、测试证据、风险说明；失败：回到规划/实现阶段</text>
<rect x="100" y="915" width="1200" height="42" rx="9" class="gray"/><text x="700" y="941" text-anchor="middle" class="body">横切治理：最小权限 · 密钥保护 · 敏感数据脱敏 · 高风险操作确认 · 审计追踪 · 人工最终负责</text></svg>