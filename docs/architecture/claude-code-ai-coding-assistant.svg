<path d="M210 596 V626 H700 M510 596 V626 M810 596 V626 M1150 596 V626 H700 V648" class="arrow"/><rect x="100" y="648" width="1200" height="120" rx="12" class="green"/><text x="700" y="677" text-anchor="middle" class="head">Claude Code 扩展与项目规则</text><text x="700" y="703" text-anchor="middle" class="body">CLAUDE.md：项目级约束与完成定义　|　Agents：职责隔离　|　Skills：可复用专业流程</text><text x="700" y="728" text-anchor="middle" class="body">Commands：任务入口　|　Hooks：确定性检查与安全护栏　|　MCP：连接外部工具和数据</text><text x="700" y="752" text-anchor="middle" class="body">Git / Shell / 文件系统 / 构建测试 / Issue / CI-CD / 数据库（按权限开放）</text>
